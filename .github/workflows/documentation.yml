name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build API documentation
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests
        run: swift test
      - name: Test documentation checks
        run: python3 -m unittest discover -s Scripts -p 'test_*.py'
      - name: Build all iOS APIs and validate documentation
        run: python3 Scripts/build_documentation.py
      - name: Compile documentation examples
        run: python3 Scripts/check_examples.py
      - name: Package PR preview
        if: github.event_name == 'pull_request'
        run: >-
          tar -czf "$RUNNER_TEMP/documentation-preview.tar.gz"
          -C .build/documentation/site .
      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: ${{ runner.temp }}/documentation-preview.tar.gz
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/documentation/site

  deploy:
    name: Publish API reference
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}api/
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
